name: keepalive
on:
  schedule:
    # Supabase says a few database requests per day are usually enough to
    # avoid inactivity pausing; this performs three lightweight checks daily.
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check database-backed health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::Set the repository variable SITE_URL to your deployed Vercel URL. Skipping keep-alive."
            exit 0
          fi

          case "$SITE_URL" in
            https://*) ;;
            *) echo "SITE_URL must start with https://"; exit 1 ;;
          esac

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            "${SITE_URL%/}/api/backend/health"
